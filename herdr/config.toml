onboarding = false
# herdr configuration
# Custom theme ported from no-clown-fiesta.nvim (dark palette).
# Keybindings mirror ~/.config/tmux/tmux.conf: C-a prefix, Colemak
# navigation (m/n/e/i = left/down/up/right), vi-flavored feel.

[theme]
name = "catppuccin"

[theme.custom]
panel_bg = "#151515"
accent = "#BAD7FF"
red = "#b46958"
green = "#90A959"
yellow = "#F4BF75"
blue = "#BAD7FF"

[terminal]
new_cwd = "follow"

[keys]
# Match tmux: C-a instead of the herdr default ctrl+b.
prefix = "ctrl+a"

reload_config = "prefix+r"
new_tab = "prefix+c"

# tmux `-h` splits left/right (a vertical divider); `-v` splits top/bottom.
split_vertical = "prefix+h"
split_horizontal = "prefix+v"

# Colemak pane navigation on plain Alt, deliberately identical to tmux's
# unprefixed M-m/n/e/i. Same direction, same action, different layer: the
# layers nest instead of competing, so one muscle memory covers both. Neovim
# binds no meta key on these four letters.
focus_pane_left = "alt+m"
focus_pane_down = "alt+n"
focus_pane_up = "alt+e"
focus_pane_right = "alt+i"

# Navigate-mode picker uses the same Colemak letters.
navigate_pane_left = "m"
navigate_pane_down = "n"
navigate_pane_up = "e"
navigate_pane_right = "i"

# Quick jumps between workspaces and agents.
#
# Letters, not brackets: alt+[ emits ESC [, byte-identical to the start of
# every CSI escape sequence, so the client cannot tell the chord from an
# arriving arrow or mouse report and drops it on the input timeout. Alt plus a
# letter has no such ambiguity.
#
# The letters follow Colemak Mod-DH geometry. Pane navigation sits on the
# right home row (m/n/e/i); these step keys sit on the top row directly above
# it (j/l/u/y), so the whole navigation set stays under one hand:
#
#     top:   .  .  .  . [B]   .  L  U  .   <- agents up, step workspaces
#     home:  .  .  .  . [G]   M  N  E  I   <- agents down, move between panes
#
# Workspaces step horizontally on the right-hand top row, directly above the
# pane keys. Agents step vertically on alt+b and alt+g, stacked in the inner
# column so up and down map to the physical up and down key.
#
# The letters are forced by what the surrounding layers already claim. Neovim
# holds meta on f/p/,/./s/t/h/w/r/c (window sizing, splits, grug-far,
# compile-mode) and tmux holds M-s and M-g, so the mnemonic alt+r/g and
# alt+s/t would each fire two actions at once. st claims alt+j and alt+k for
# scrollback, its MODKEY being Mod1Mask, and consumes them before the terminal
# forwards anything, so a binding there validates but is never reached. That
# leaves the inner column as the only one with two free keys stacked
# vertically.
#
# alt+g also names tmux's unprefixed M-g popup toggle, which costs nothing
# here: tmux and herdr are never run at the same time, so the two never
# compete for the chord.
workspace_picker = "prefix+w"
previous_workspace = "alt+l"
next_workspace = "alt+u"
switch_workspace = "prefix+shift+1..9"
previous_agent = "alt+b"
next_agent = "alt+g"
focus_agent = "prefix+alt+1..9"

# Scrollback in $EDITOR, and instant toggle back to the last pane
# (like tmux's `sesh last`).
edit_scrollback = "prefix+e"
last_pane = "alt+a"

# Zoom current pane and toggle the sidebar.
zoom = "prefix+z"
toggle_sidebar = "prefix+b"

# Cycle only agents actively working, without replacing the native all-agent
# previous/next bindings above. alt+d keeps it off the j/l/u/y stepping row
# while staying free in both neovim and tmux.
[[keys.command]]
key = "alt+d"
type = "shell"
command = "~/.config/herdr/working-agent.sh next"

# lazyjj popup, mirroring tmux's M-g floating terminal. The wrapper keeps the
# popup open with an explanation when the active pane is outside a jj repo.
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "~/.config/herdr/lazyjj.sh"
width = "80%"
height = "75%"

# Fuzzy-pick any agent, ranked by attention needed then most-recent activity.
# The companion to prefix+u: that key jumps without showing the queue, this one
# shows the whole roster when the wanted agent is not the top-ranked one.
[[keys.command]]
key = "prefix+a"
type = "popup"
command = "~/.config/herdr/agent-picker.sh"
# Cells, not percentages: the widest row is 82 display columns, so a percentage
# would only add empty space on a wide screen. 86 covers that plus the fzf
# pointer gutter and the popup border. Measure with a width that counts
# characters, not bytes: the icons are multibyte and inflate a byte count by
# several columns. 16 rows holds a dozen agents, and fzf scrolls past that.
width = 86
height = 16

# Jump to whichever agent most needs attention (blocked, then done, then idle).
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "aktersnurra.next-agent.jump"
description = "next agent needing attention"

# Review the working copy in tuicr, in a vertical split beside the agent
# pane. The script does the splitting, so this runs detached rather than as
# a popup.
[[keys.command]]
key = "prefix+d"
type = "shell"
command = "~/.config/herdr/review-pane.sh"

# Fuzzy-pick a repo or jj workspace, then open one tracked file in tuicr.
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "~/.config/herdr/tuicr-file-pane.sh"
width = "60%"
height = "60%"

# Fuzzy-pick a repo or jj workspace, then review its master/main change stack.
[[keys.command]]
key = "prefix+s"
type = "popup"
command = "~/.config/herdr/tuicr-stack-pane.sh"
width = "60%"
height = "60%"

# Fuzzy-pick an existing repo or jj workspace and open it as a workspace.
[[keys.command]]
key = "prefix+o"
type = "popup"
command = "~/.config/herdr/open-workspace.sh"
width = "60%"
height = "60%"

# New jj workspace in <repo-name>.workspaces/<feature>, opened as its own
# herdr workspace. Prompts for the feature name.
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "~/.config/herdr/new-jj-workspace.sh"
width = "60%"
height = "40%"

[ui]
sidebar_start_collapsed = true
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
accent = "#BAD7FF"

[ui.sound]
enabled = true

# Native macOS notification when a background agent finishes or needs input.
[ui.toast]
delivery = "system"

[ui.sidebar.agents]
rows = [
  [
    "state_icon",
    "workspace",
    "tab",
  ],
  [
    "terminal_title_stripped",
  ],
  [
    "agent",
  ],
]

[session]
resume_agents_on_restore = true
