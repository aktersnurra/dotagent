<title>Storyline</title>
<style>
/*
  A story is one long document under a thin bar, with an outline that can be folded away. Questions open
  as one floating thread beside the passage they are about.

  Type: Literata for reading, IBM Plex Mono for code, Inter for the interface. All embedded, so the page
  looks the same everywhere and loads nothing.

  Colour: the no-clown-fiesta palette (its dark and light variants), so the story looks like the editor
  it is read next to. Blue is the story's own voice (numbers, the place you are). Yellow is the reader's
  voice and nothing else: a marked passage, a question. Green and red belong to the diff.
*/
@font-face { font-family: "Literata"; font-weight: 400; font-display: swap; src: url(data:font/woff2;base64,__LIT_400__) format("woff2"); }
@font-face { font-family: "Literata"; font-weight: 400; font-style: italic; font-display: swap; src: url(data:font/woff2;base64,__LIT_400I__) format("woff2"); }
@font-face { font-family: "Literata"; font-weight: 700; font-display: swap; src: url(data:font/woff2;base64,__LIT_700__) format("woff2"); }
@font-face { font-family: "Plex Mono"; font-weight: 400; font-display: swap; src: url(data:font/woff2;base64,__MONO_400__) format("woff2"); }
@font-face { font-family: "Plex Mono"; font-weight: 600; font-display: swap; src: url(data:font/woff2;base64,__MONO_600__) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 400; font-display: swap; src: url(data:font/woff2;base64,__INTER_400__) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 500; font-display: swap; src: url(data:font/woff2;base64,__INTER_500__) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 600; font-display: swap; src: url(data:font/woff2;base64,__INTER_600__) format("woff2"); }
:root {
  --sheet: #e1e1e1; --ground: #d6d6d6; --panel: #d6d6d6; --ink: #151515; --muted: #373737; --faint: #637786; --line: #cfcfcf; --rule: #aaaaaa;
  --survey: #57788d; --survey-ink: #e1e1e1; --select: #aaaaaa;
  --marker: #f4bf75; --mark-bg: #f4bf75; --mark-ink: #151515; --note: #d6d6d6; --note-edge: #b89058;
  --add: #677940; --add-edge: #586935; --add-bg: #ccdec6; --del: #874e42; --del-edge: #984936; --del-bg: #dec6c6; --amber: #ab8550;
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Literata", Charter, "Iowan Old Style", Georgia, serif;
  --mono: "Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sheet: #151515; --ground: #171717; --panel: #171717; --ink: #e1e1e1; --muted: #afafaf; --faint: #727272; --line: #202020; --rule: #373737;
  --survey: #bad7ff; --survey-ink: #151515; --select: #373737;
  --marker: #f4bf75; --mark-bg: rgba(244, 191, 117, .28); --mark-ink: #e1e1e1; --note: #202020; --note-edge: #f4bf75;
  --add: #90a959; --add-edge: #586935; --add-bg: color-mix(in srgb, #90a959 13%, transparent);
  --del: #b46958; --del-edge: #984936; --del-bg: color-mix(in srgb, #b46958 15%, transparent); --amber: #ffa557;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --sheet: #151515; --ground: #171717; --panel: #171717; --ink: #e1e1e1; --muted: #afafaf; --faint: #727272; --line: #202020; --rule: #373737;
  --survey: #bad7ff; --survey-ink: #151515; --select: #373737;
  --marker: #f4bf75; --mark-bg: rgba(244, 191, 117, .28); --mark-ink: #e1e1e1; --note: #202020; --note-edge: #f4bf75;
  --add: #90a959; --add-edge: #586935; --add-bg: color-mix(in srgb, #90a959 13%, transparent);
  --del: #b46958; --del-edge: #984936; --del-bg: color-mix(in srgb, #b46958 15%, transparent); --amber: #ffa557;
  color-scheme: dark; }

* { box-sizing: border-box; }
/* The whole interface grows with the window, so a large screen is filled with larger type, not more emptiness. */
html { font-size: clamp(16px, 0.36vw + 10px, 25px); --r1: 0.375rem; --r2: 0.5rem; --r3: 0.875rem; --ease: 120ms ease; }
html, body { height: 100%; }
body { margin: 0; background: var(--sheet); color: var(--ink); font: 0.8125rem/1.45 var(--ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
#root { height: 100%; }
:focus-visible { outline: 2px solid var(--survey); outline-offset: 2px; }
::selection { background: var(--select); }
::highlight(asked) { background: var(--mark-bg); color: var(--mark-ink); }
button { font: inherit; cursor: pointer; color: inherit; }
.icon { display: block; flex: none; width: 1.25rem; height: 1.25rem; }
.link { padding: 0; color: var(--muted); background: none; border: 0; text-decoration: underline; text-underline-offset: 2px; }
.link:hover { color: var(--ink); }
.meta { margin: 0; font-size: 0.875rem; color: var(--muted); }

/* Bar, outline, document */
.app { height: 100%; display: grid; grid-template: 2.75rem minmax(0, 1fr) / 16rem minmax(0, 1fr); }
.app.no-sidebar { grid-template-columns: minmax(0, 1fr); }
.bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 0.5rem; padding: 0 0.75rem; background: var(--ground); border-bottom: 1px solid var(--line); }
.bar-title { min-width: 0; padding: 0.25rem 0.375rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; background: none; border: 0; border-radius: var(--r1); transition: background var(--ease); }
.bar-title:hover { background: var(--line); }
.chip { flex: none; padding: 0.1rem 0.45rem; font: 0.75rem var(--mono); color: var(--muted); border: 1px solid var(--rule); border-radius: 999px; }
.bar-space { flex: 1; }
.seg { display: flex; gap: 2px; padding: 2px; background: var(--line); border-radius: var(--r2); }
.tool, .act { flex: none; display: grid; place-items: center; width: 1.75rem; height: 1.75rem; padding: 0; background: none; border: 0; border-radius: var(--r1); color: var(--muted);
  transition: background var(--ease), color var(--ease); }
.tool:hover, .act:hover { background: var(--line); color: var(--ink); }
.seg .tool:hover { background: none; }
.tool[aria-pressed="true"] { background: var(--line); color: var(--ink); }
.seg .tool[aria-pressed="true"] { background: var(--sheet); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
.ask-toggle[aria-pressed="true"] { background: var(--marker); color: #151515; }

.pane { position: relative; min-width: 0; overflow-y: auto; scroll-behavior: smooth; }
.pane > .canvas { height: 100%; }
@media (prefers-reduced-motion: reduce) { .pane { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }

.outline { overflow-y: auto; padding: 0.75rem 0.5rem 2rem; background: var(--ground); border-right: 1px solid var(--line); }
.outline ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.outline li { display: flex; align-items: center; padding-left: calc(var(--depth, 0) * 0.875rem); }
.outline li.heading { display: block; margin: 1rem 0.5rem 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--faint); }
.outline li.heading:first-child { margin-top: 0.25rem; }
.row { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.5rem; height: 1.75rem; padding: 0 0.5rem; text-align: left; background: none; border: 0; border-radius: var(--r1); color: var(--muted);
  transition: background var(--ease), color var(--ease); }
.row:hover { background: var(--line); color: var(--ink); }
.row[data-read="true"] { color: var(--ink); }
.row[aria-current="true"] { background: var(--line); color: var(--ink); font-weight: 500; }
.row-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mark { flex: none; width: 1rem; text-align: center; font: 500 0.75rem/1 var(--ui); font-variant-numeric: tabular-nums; color: var(--faint); }
.row[aria-current="true"] .mark { color: var(--survey); }
.mark:empty::before { content: ""; display: inline-block; width: 0.3rem; height: 0.3rem; border-radius: 50%; background: var(--rule); vertical-align: middle; }
.row[data-read="true"] .mark:empty::before { background: var(--survey); }
.row[data-kind="Risk"] .mark { color: var(--amber); }
.asked { flex: none; width: 0.4rem; height: 0.4rem; background: var(--marker); border-radius: 50%; }
.fold, .fold-gap { flex: none; width: 1.25rem; height: 1.25rem; }
.fold { display: grid; place-items: center; padding: 0; background: none; border: 0; border-radius: var(--r1); color: var(--faint); }
.fold:hover { color: var(--ink); }
.fold .icon { width: 1rem; height: 1rem; transition: transform var(--ease); }
.fold[aria-expanded="true"] .icon { transform: rotate(90deg); }
.unsaved { margin: 0.75rem 0.5rem 0; color: var(--del); }

/* The document: one reading column, with room beside it for the open thread. */
.doc { --thread: 25rem; --gap: 2.5rem; max-width: calc(64rem + var(--thread) + var(--gap) + 10rem); margin-inline: auto;
  padding: 5rem calc(var(--thread) + var(--gap) + 2rem) 70vh 7.5rem; font: 1.125rem/1.62 var(--serif); }
.masthead { max-width: 52rem; margin-bottom: 4rem; }
.kind { margin: 0 0 1rem; }
.kind code { font: 0.875rem var(--mono); color: var(--survey); }
.masthead h1 { margin: 0; font: 700 3.5rem/1.06 var(--serif); letter-spacing: -0.02em; text-wrap: balance; }
.part { margin: 4.5rem 0 0; padding-bottom: 0.5rem; border-bottom: 1px solid var(--rule); font: 500 0.875rem var(--ui); color: var(--muted); }

.sec { position: relative; padding-top: 3.25rem; scroll-margin-top: 0.5rem; }
.sec-body { position: relative; min-width: 0; }
.sec-body > * { max-width: 40rem; }
.sec-body > .panel { max-width: none; }
.sec-body > h2 { max-width: 46rem; }
.sec h2 { margin: 0 0 0.75rem; font: 700 1.875rem/1.18 var(--serif); letter-spacing: -0.01em; text-wrap: balance; }
.sec h3 { margin: 0 0 0.5rem; font: 700 1.375rem/1.25 var(--serif); text-wrap: balance; }
.sec p { margin: 0 0 1rem; }
/* The walkthrough is a sequence, so its steps are numbered; the number hangs in the margin. */
.num { position: absolute; right: calc(100% + 1.25rem); top: -0.05em; font: 700 1.875rem/1.18 var(--serif); color: var(--survey); font-variant-numeric: lining-nums; }
.sec[data-kind="Risk"] .num { color: var(--amber); }
.reason { font-style: italic; color: var(--muted); }
.anchor { font: 0.8125rem/1.5 var(--mono); color: var(--faint); }
.steps { margin: 0 0 1rem; padding-left: 1.4em; display: grid; gap: 0.35rem; }
.severity { display: inline-flex; align-items: center; gap: 0.4rem; margin: 0 0 0.6rem; padding: 0.15rem 0.6rem 0.15rem 0.5rem; font: 500 0.8125rem var(--ui); color: var(--amber);
  border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent); border-radius: 999px; }
.severity::before { content: ""; width: 0.45rem; height: 0.45rem; border-radius: 50%; background: currentColor; }
.severity.low { color: var(--muted); border-color: var(--rule); }
.severity.high { color: var(--del); border-color: color-mix(in srgb, var(--del) 45%, transparent); }
.links { list-style: none; margin: 0.5rem 0 0; padding: 0; display: grid; gap: 0.3rem; font: 0.875rem var(--ui); }
.links .rel { color: var(--faint); margin-right: 0.5rem; }
.sec code { font: 0.875em var(--mono); }

/* Code and diffs */
.panel { margin: 1.5rem 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); overflow: clip; }
.panel-head { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; gap: 1rem; padding: 0.5rem 1rem; background: var(--panel); border-bottom: 1px solid var(--line);
  font: 500 0.8125rem/1.4 var(--mono); }
.counts { display: flex; gap: 0.75rem; font-weight: 400; }
.panel pre { margin: 0; padding: 0.5rem 0; overflow-x: auto; font: 0.875rem/1.6 var(--mono); tab-size: 4; }
.panel code { display: block; width: max-content; min-width: 100%; font: inherit; }
.ln { display: block; padding-right: 1rem; }
.no { display: inline-block; box-sizing: content-box; padding-left: 1rem; text-align: right; color: var(--faint); user-select: none; }
.sign { display: inline-block; width: 4ch; text-align: center; user-select: none; }
.ln.add { background: var(--add-bg); box-shadow: inset 3px 0 0 var(--add-edge); }
.ln.del { background: var(--del-bg); box-shadow: inset 3px 0 0 var(--del-edge); }
.ln.add, .ln.del { color: inherit; }
.ln.add .sign { color: var(--add); }
.ln.del .sign { color: var(--del); }
.ln.hdr { padding: 0.15rem 1rem; color: var(--faint); font-style: italic; }
.add { color: var(--add); }
.del { color: var(--del); }

/* Ask: point at anything in the story and click it. */
.asking .sec-body { cursor: pointer; user-select: none; }
.asking .sec-body :is(h2, h3, p, li, .ln):hover, .asking .panel:has(.panel-head:hover) {
  background: var(--mark-bg); color: var(--mark-ink); outline: 2px solid var(--marker); outline-offset: 2px; border-radius: 2px; }
.asking .panel .ln:hover { outline-offset: -2px; }

/* A passage that has questions carries a pin beside it; the open thread floats there instead. */
.pin, .float { position: absolute; left: calc(100% + var(--gap)); }
.pin { display: inline-flex; align-items: center; gap: 0.3rem; height: 1.75rem; padding: 0 0.5rem; font: 500 0.75rem var(--ui); color: var(--muted);
  background: var(--ground); border: 1px solid var(--line); border-radius: 999px; transition: color var(--ease), border-color var(--ease); }
.pin .icon { width: 1rem; height: 1rem; color: var(--note-edge); }
.pin:hover { color: var(--ink); border-color: var(--rule); }
.float { z-index: 5; width: var(--thread); animation: rise 140ms ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } }
.thread { display: grid; gap: 0.75rem; max-height: min(70vh, 40rem); padding: 0.75rem; background: var(--ground); border: 1px solid var(--rule); border-radius: var(--r3);
  box-shadow: 0 12px 40px rgba(0, 0, 0, .35), 0 2px 6px rgba(0, 0, 0, .2); font: 0.8125rem/1.5 var(--ui); grid-template-rows: auto minmax(0, 1fr) auto; }
.thread-head { display: flex; align-items: start; gap: 0.125rem; }
.thread .quote { flex: 1; margin: 0.2rem 0.5rem 0 0.25rem; padding-left: 0.6rem; border-left: 2px solid var(--marker); color: var(--muted);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.thread-head > span { flex: 1; }
.turns { display: grid; gap: 1rem; padding: 0 0.25rem; overflow-y: auto; }
.turn { display: grid; gap: 0.6rem; }
.turn .q { justify-self: end; max-width: 85%; margin: 0; padding: 0.45rem 0.75rem; background: var(--line); border-radius: var(--r3) var(--r3) 0.25rem var(--r3); }
.turn .a { margin: 0; white-space: pre-wrap; font: 0.9375rem/1.6 var(--serif); }
.turn .a.streaming::after { content: ""; display: inline-block; width: 0.5em; height: 1em; margin-left: 0.15em; vertical-align: text-bottom; background: var(--muted); border-radius: 1px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.turn .a.error { display: flex; align-items: center; gap: 0.5rem; color: var(--del); font-family: var(--ui); }
.composer { display: flex; align-items: end; gap: 0.5rem; padding: 0.4rem 0.4rem 0.4rem 0.75rem; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r3); transition: border-color var(--ease); }
.composer:focus-within { border-color: var(--muted); }
.composer textarea { flex: 1; min-width: 0; max-height: 10rem; padding: 0.3rem 0; font: inherit; color: var(--ink); background: none; border: 0; outline: 0; resize: none; }
.composer textarea::placeholder { color: var(--faint); }
.send { flex: none; display: grid; place-items: center; width: 1.75rem; height: 1.75rem; padding: 0; color: var(--sheet); background: var(--ink); border: 0; border-radius: 50%; transition: opacity var(--ease); }
.send .icon { width: 1.1rem; height: 1.1rem; }
.send:disabled { opacity: .3; cursor: default; }

/* Map */
.canvas { position: relative; overflow: hidden; cursor: grab; touch-action: none; background: var(--ground);
  background-image: radial-gradient(var(--line) 1px, transparent 1px);
  background-size: calc(24px * var(--k)) calc(24px * var(--k)); background-position: var(--x) var(--y); }
.canvas.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edge { stroke: var(--survey); stroke-width: 1.5; fill: none; stroke-linejoin: round; }
.arrow { fill: var(--survey); }
.edge-label { font: 13px var(--ui); fill: var(--survey); paint-order: stroke; stroke: var(--ground); stroke-width: 7px; stroke-linejoin: round; }
.lane { position: absolute; margin: 0; font: 600 15px/1.3 var(--ui); white-space: nowrap; }
.node { position: absolute; display: flex; flex-direction: column; gap: 8px; padding: 0 14px 12px;
  background: var(--sheet); border: 1px solid var(--ink); border-radius: 2px; cursor: pointer; user-select: none; }
.node:hover { border-color: var(--survey); box-shadow: 0 0 0 1px var(--survey); }
.node-kind { margin: 0 -14px; padding: 3px 14px; font: 12.5px/1.4 var(--ui); color: var(--muted); border-bottom: 1px solid var(--line); background: var(--panel); }
.node[data-kind="Risk"] { border-left: 4px solid var(--amber); }
.node-title { font: 600 16px/1.25 var(--ui); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node-summary { font: 14px/1.4 var(--ui); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node > * { flex: none; }
.node-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; font-size: 13px; color: var(--muted); }
.node-meta .mono { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.parts-badge { display: inline-flex; align-items: center; color: var(--survey); white-space: nowrap; }
.pv-steps { margin: 0; padding-left: 1.3em; font-size: 13.5px; line-height: 1.4; }
.pv-steps li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-steps .more { list-style: none; margin-left: -1.3em; color: var(--muted); }
.pv-code { margin: 0; padding: 5px 8px; background: var(--panel); border: 1px solid var(--line); font: 11.5px/1.45 var(--mono); overflow: hidden; white-space: pre; }
.pv-code .ln { padding: 0; }
.step { position: absolute; top: -11px; left: -11px; z-index: 1; width: 24px; height: 24px; display: grid; place-items: center;
  font: 600 13px/1 var(--ui); color: var(--survey-ink); background: var(--ink); border-radius: 50%; }
.controls { position: absolute; left: 12px; bottom: 12px; z-index: 3; display: flex; align-items: center; gap: 2px; padding: 3px;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 2px; cursor: default; }
.controls button { display: grid; place-items: center; min-width: 32px; height: 32px; padding: 0 6px; background: none; border: 0; border-radius: 2px; }
.controls button:hover { background: var(--panel); }
.zoom { min-width: 48px; text-align: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Page states */
.state { max-width: 40rem; margin: 12vh auto 0; padding-inline: 1.25rem; font: 1.0625rem/1.6 var(--serif); }
.state h1 { font: 700 1.75rem/1.2 var(--serif); }
.state ul { padding-left: 1.2em; }

/* Without room beside the text, the thread sits under its section and the pins move inside the edge. */
@media (max-width: 1500px) {
  .app { grid-template-columns: 14rem minmax(0, 1fr); }
  .doc { padding: 3rem 1.5rem 60vh 4.5rem; }
  .masthead h1 { font-size: 2.5rem; }
  .float { position: static; width: auto; max-width: 40rem; margin-top: 1rem; }
  .pin { left: auto; right: 0; }
}
</style>
<div id="root"><p class="meta" style="max-width:40rem;margin:12vh auto 0">Opening story…</p></div>
