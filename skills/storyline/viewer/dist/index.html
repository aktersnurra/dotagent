  --sheet: #151515; --ground: #171717; --panel: #171717; --ink: #e1e1e1; --muted: #afafaf; --faint: #727272; --line: #202020; --rule: #373737;

* { box-sizing: border-box; }
/* The whole interface grows with the window, so a large screen is filled with larger type, not more emptiness. */
html { font-size: clamp(16px, 0.36vw + 10px, 25px); }
html, body { height: 100%; }
body { margin: 0; background: var(--sheet); color: var(--ink); font: 0.9375rem/1.45 var(--ui); overflow: hidden; }
#root { height: 100%; }
:focus-visible { outline: 2px solid var(--survey); outline-offset: 2px; }
::selection { background: var(--select); }
::highlight(asked) { background: var(--mark-bg); color: var(--mark-ink); }
button { font: inherit; cursor: pointer; color: inherit; }
.icon { display: block; flex: none; width: 1.3em; height: 1.3em; }
.link { padding: 0; color: var(--muted); background: none; border: 0; text-decoration: underline; text-underline-offset: 2px; }
.link:hover { color: var(--ink); }
.primary { padding: 0.4rem 1rem; color: var(--survey-ink); background: var(--ink); border: 0; border-radius: 3px; }
.primary:disabled { opacity: .45; cursor: not-allowed; }
.meta { margin: 0; font-size: 0.875rem; color: var(--muted); }

/* Outline beside the document */
.app { height: 100%; width: 100%; max-width: 122rem; margin-inline: auto; display: grid; grid-template-columns: 17rem minmax(0, 1fr); }
.app.map { max-width: none; }
.pane { position: relative; min-width: 0; overflow-y: auto; scroll-behavior: smooth; }
.pane > .canvas { height: 100%; }
@media (prefers-reduced-motion: reduce) { .pane { scroll-behavior: auto; } }

.outline { overflow-y: auto; padding: 1.5rem 0.75rem 2rem; background: var(--ground); border-inline: 1px solid var(--line); }
.outline ul { list-style: none; margin: 0; padding: 0; }
.outline li { display: flex; align-items: center; padding-left: calc(var(--depth, 0) * 0.875rem); }
.outline li.heading { display: block; margin: 1.25rem 0.5rem 0.25rem; font-weight: 600; color: var(--muted); }
.story { display: grid; gap: 0.25rem; width: 100%; margin-bottom: 0.75rem; padding: 0.25rem 0.5rem; text-align: left; background: none; border: 0; border-radius: 3px; }
.story:hover { background: var(--line); }
.story-title { font: 700 1.0625rem/1.25 var(--serif); text-wrap: balance; }
.story-rev { font: 0.75rem var(--mono); color: var(--muted); }
.row { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0.5rem; text-align: left; background: none; border: 0; border-radius: 3px; color: var(--muted); }
.row:hover { background: var(--line); color: var(--ink); }
.row[data-read="true"] { color: var(--ink); }
.row[aria-current="true"] { background: var(--line); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--survey); }
.row-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mark { flex: none; width: 1.2rem; text-align: center; font: 600 0.8125rem/1 var(--ui); font-variant-numeric: tabular-nums; color: var(--survey); }
.mark:empty::before { content: ""; display: inline-block; width: 0.3rem; height: 0.3rem; border-radius: 50%; background: var(--rule); vertical-align: middle; }
.row[data-read="true"] .mark:empty::before { background: var(--survey); }
.row[data-kind="Risk"] .mark { color: var(--amber); }
.asked { flex: none; width: 0.55rem; height: 0.55rem; background: var(--marker); border-radius: 1px; }
.fold, .fold-gap { flex: none; width: 1.25rem; height: 1.25rem; }
.fold { display: grid; place-items: center; padding: 0; background: none; border: 0; color: var(--muted); }
.fold .icon { transition: transform .12s; }
.fold[aria-expanded="true"] .icon { transform: rotate(90deg); }
.unsaved { margin: 0.75rem 0.5rem 0; font-size: 0.8125rem; color: var(--del); }

/* The document. Two columns all the way down: the story, and the reader's notes beside it. */
.doc { --notes: 23rem; --gap: 3.5rem; max-width: 100rem; padding: 5.5rem 3rem 70vh 7.5rem; font: 1.125rem/1.62 var(--serif); }
.masthead { max-width: 52rem; margin-bottom: 4.5rem; }
.kind { margin: 0 0 1rem; font: 1rem var(--ui); color: var(--muted); }
.kind code { font: 0.875rem var(--mono); color: var(--survey); }
.masthead h1 { margin: 0; font: 700 3.5rem/1.06 var(--serif); letter-spacing: -0.02em; text-wrap: balance; }
.part { margin: 4.5rem calc(var(--notes) + var(--gap)) 0 0; padding-bottom: 0.5rem; border-bottom: 2px solid var(--ink); font: 600 1.0625rem var(--ui); }

.sec { display: grid; grid-template-columns: minmax(0, 1fr) var(--notes); column-gap: var(--gap); padding-top: 3.25rem; scroll-margin-top: 0.5rem; }
.sec-body { position: relative; min-width: 0; padding-left: calc(var(--depth, 0) * 2rem); }
.sec-body > * { max-width: 40rem; }
.sec-body > .panel { max-width: none; }
.sec-body > h2 { max-width: 46rem; }
.sec h2 { margin: 0 0 0.75rem; font: 700 1.875rem/1.18 var(--serif); letter-spacing: -0.01em; text-wrap: balance; }
.sec h3 { margin: 0 0 0.5rem; font: 700 1.375rem/1.25 var(--serif); text-wrap: balance; }
.sec p { margin: 0 0 1rem; }
/* The walkthrough is a sequence, so its steps are numbered; the number hangs in the margin. */
.num { position: absolute; right: calc(100% + 1.25rem); top: -0.05em; font: 700 1.875rem/1.18 var(--serif); color: var(--survey); font-variant-numeric: lining-nums; }
.sec[data-kind="Risk"] .num { color: var(--amber); }
.reason { font-style: italic; color: var(--muted); }
.anchor { font: 0.8125rem/1.5 var(--mono); color: var(--muted); }
.steps { margin: 0 0 1rem; padding-left: 1.4em; display: grid; gap: 0.35rem; }
.severity { display: inline-block; margin: 0 0 0.5rem; font: 600 0.9375rem var(--ui); color: var(--muted); }
.severity.medium, .severity.high { color: var(--amber); }
.severity.high { color: var(--del); }
.links { list-style: none; margin: 0.5rem 0 0; padding: 0; display: grid; gap: 0.3rem; font: 0.9375rem var(--ui); }
.links .rel { color: var(--muted); margin-right: 0.5rem; }
.sec code { font: 0.875em var(--mono); }

/* Code and diffs */
.panel { margin: 1.5rem 0; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; gap: 1rem; padding: 0.55rem 1rem; border-bottom: 1px solid var(--line); font: 600 0.875rem/1.4 var(--mono); }
.counts { display: flex; gap: 0.75rem; font-weight: 400; }
.panel pre { margin: 0; padding: 0.5rem 0; overflow-x: auto; font: 0.875rem/1.6 var(--mono); tab-size: 4; }
.panel code { display: block; width: max-content; min-width: 100%; font: inherit; }
.ln { display: block; padding-right: 1rem; }
.no { display: inline-block; box-sizing: content-box; padding-left: 1rem; text-align: right; color: var(--faint); user-select: none; }
.sign { display: inline-block; width: 4ch; text-align: center; user-select: none; }
.ln.add { background: var(--add-bg); box-shadow: inset 3px 0 0 var(--add-edge); }
.ln.del { background: var(--del-bg); box-shadow: inset 3px 0 0 var(--del-edge); }
.ln.add, .ln.del { color: inherit; }
.ln.add .sign { color: var(--add); }
.ln.del .sign { color: var(--del); }
.ln.hdr { padding: 0.15rem 1rem; color: var(--muted); font-style: italic; }
.add { color: var(--add); }
.del { color: var(--del); }

/* The reader's notes: highlighter yellow */
.sec-notes { position: sticky; top: 1.5rem; align-self: start; display: grid; gap: 0.75rem; font: 0.9375rem/1.45 var(--ui); }
.thread { display: grid; gap: 0.75rem; padding: 0.75rem 1rem 0.875rem; background: var(--note); border-top: 3px solid var(--note-edge); border-radius: 0 0 4px 4px; }
.thread-head { display: flex; justify-content: space-between; align-items: start; gap: 0.5rem; }
.thread-head .act { margin: -0.3rem -0.5rem 0 0; }
.thread .quote { margin: 0; font: italic 0.9375rem/1.45 var(--serif); color: var(--muted); }
.turn { display: grid; gap: 0.4rem; }
.turn + .turn { padding-top: 0.75rem; border-top: 1px solid var(--rule); }
.turn .q { margin: 0; font-weight: 600; }
.turn .a { margin: 0; white-space: pre-wrap; font: 1rem/1.55 var(--serif); }
.turn .a.error { color: var(--del); font-family: var(--ui); }
.turn textarea { font: 0.9375rem/1.45 var(--ui); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; padding: 0.5rem; resize: vertical; }
.actions { display: flex; align-items: center; gap: 0.25rem; margin: -0.25rem -0.35rem; }

/* Ask: point at anything in the story and click it. */
.tools { display: flex; gap: 0.35rem; margin: 0 0.5rem 0.75rem; }
.tool, .act { display: grid; place-items: center; width: 2rem; height: 2rem; padding: 0; background: none; border: 1px solid transparent; border-radius: 3px; color: var(--muted); }
.tool { border-color: var(--rule); }
.tool:hover, .act:hover { color: var(--ink); border-color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.ask-toggle[aria-pressed="true"] { background: var(--marker); border-color: var(--marker); color: #151515; }
.act:disabled { opacity: .35; cursor: not-allowed; border-color: transparent; }
.asking .sec-body { cursor: pointer; user-select: none; }
.asking .sec-body :is(h2, h3, p, li, .ln):hover, .asking .panel:has(.panel-head:hover) {
  background: var(--mark-bg); color: var(--mark-ink); outline: 2px solid var(--marker); outline-offset: 2px; border-radius: 2px; }
.asking .panel .ln:hover { outline-offset: -2px; }

/* Map */
.canvas { position: relative; overflow: hidden; cursor: grab; touch-action: none; background: var(--ground);
  background-image: radial-gradient(var(--line) 1px, transparent 1px);
  background-size: calc(24px * var(--k)) calc(24px * var(--k)); background-position: var(--x) var(--y); }
.canvas.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edge { stroke: var(--survey); stroke-width: 1.5; fill: none; }
.arrow { fill: var(--survey); }
.edge-label { font: 13px var(--ui); fill: var(--survey); paint-order: stroke; stroke: var(--ground); stroke-width: 7px; stroke-linejoin: round; }
.lane { position: absolute; margin: 0; font: 600 15px/1.3 var(--ui); white-space: nowrap; }
.node { position: absolute; display: flex; flex-direction: column; gap: 8px; padding: 0 14px 12px;
  background: var(--sheet); border: 1px solid var(--ink); border-radius: 2px; cursor: pointer; user-select: none; }
.node:hover { border-color: var(--survey); box-shadow: 0 0 0 1px var(--survey); }
.node-kind { margin: 0 -14px; padding: 3px 14px; font: 12.5px/1.4 var(--ui); color: var(--muted); border-bottom: 1px solid var(--line); background: var(--panel); }
.node[data-kind="Risk"] { border-left: 4px solid var(--amber); }
.node-title { font: 600 16px/1.25 var(--ui); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node-summary { font: 14px/1.4 var(--ui); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node > * { flex: none; }
.node-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; font-size: 13px; color: var(--muted); }
.node-meta .mono { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.parts-badge { display: inline-flex; align-items: center; color: var(--survey); white-space: nowrap; }
.pv-steps { margin: 0; padding-left: 1.3em; font-size: 13.5px; line-height: 1.4; }
.pv-steps li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-steps .more { list-style: none; margin-left: -1.3em; color: var(--muted); }
.pv-code { margin: 0; padding: 5px 8px; background: var(--panel); border: 1px solid var(--line); font: 11.5px/1.45 var(--mono); overflow: hidden; white-space: pre; }
.pv-code .ln { padding: 0; }
.step { position: absolute; top: -11px; left: -11px; z-index: 1; width: 24px; height: 24px; display: grid; place-items: center;
  font: 600 13px/1 var(--ui); color: var(--survey-ink); background: var(--ink); border-radius: 50%; }
.controls { position: absolute; left: 12px; bottom: 12px; z-index: 3; display: flex; align-items: center; gap: 2px; padding: 3px;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 2px; cursor: default; }
.controls button { display: grid; place-items: center; min-width: 32px; height: 32px; padding: 0 6px; background: none; border: 0; border-radius: 2px; }
.controls button:hover { background: var(--panel); }
.zoom { min-width: 48px; text-align: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Page states */
.state { max-width: 40rem; margin: 12vh auto 0; padding-inline: 1.25rem; font: 1.0625rem/1.6 var(--serif); }
.state h1 { font: 700 1.75rem/1.2 var(--serif); }
.state ul { padding-left: 1.2em; }

@media (max-width: 1400px) {
  .app { grid-template-columns: 14rem minmax(0, 1fr); }
  .doc { padding: 3rem 1.5rem 60vh 4.5rem; }
  .masthead h1 { font-size: 2.5rem; }
  .sec { grid-template-columns: minmax(0, 1fr); }
  .sec-notes { position: static; margin-top: 1rem; max-width: 40rem; }
  .part { margin-right: 0; }
}
